name: Auto Renew Kaggle Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */11 * * *'

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Kaggle Auto-Pusher
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install kaggle
          python3 -c "
          import os
          from kaggle.api.kaggle_api_extended import KaggleApi
          
          api = KaggleApi()
          api.authenticate()
          
          print('⏳ جاري سحب وتحديث المفكرة...')
          api.kernels_pull('saifather1/notebookc59511172f', path='workspace', metadata=True)
          
          print('🚀 جاري إرسال أمر التشغيل في الخلفية (Save & Run All)...')
          api.kernels_push('workspace')
          print('✅ تم التجديد بنجاح!')
          "
