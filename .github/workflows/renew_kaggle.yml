name: Auto Renew Kaggle Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */11 * * *'

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Kaggle Auto-Pusher
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install -q kaggle
          
          # إنشاء ملف التوثيق الرسمي لكاجل لتجنب مشاكل المتغيرات
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
          echo "🔍 جاري التحقق من الحساب وصلاحيات الوصول..."
          kaggle kernels status saifather1/notebookc59511172f
          
          mkdir -p workspace
          echo "⏳ جاري سحب المفكرة..."
          kaggle kernels pull saifather1/notebookc59511172f -p workspace -m
          
          echo "📄 محتويات المجلد المسحوب:"
          ls -la workspace
          
          echo "🚀 جاري إعادة رفع وتشغيل المفكرة..."
          kaggle kernels push -p workspace
          
          echo "✅ تم التجديد بنجاح!"
