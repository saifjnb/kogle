name: Auto Renew Kaggle Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */11 * * *'

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Kaggle Auto-Pusher
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "❌ خطأ: لم يتم العثور على KAGGLE_USERNAME أو KAGGLE_KEY في Secrets!"
            exit 1
          fi
          
          pip install -q kaggle
          mkdir -p workspace
          
          echo "⏳ جاري سحب وتحديث المفكرة..."
          kaggle kernels pull saifather1/notebookc59511172f -p workspace -m
          
          echo "🚀 جاري إرسال أمر التشغيل في الخلفية (Save & Run All)..."
          kaggle kernels push -p workspace
          
          echo "✅ تم التجديد بنجاح!"
